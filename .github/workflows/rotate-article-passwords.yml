name: Rotate encrypted article passwords

on:
  schedule:
    - cron: '0 * * * *' # Hourly retry; script rotates only once per Beijing date
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-article-passwords
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rotate passwords
        run: node scripts/rotate-article-passwords.mjs
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/content/blog public/daily-password.json
          git diff --cached --quiet || git commit -m "chore(blog): rotate encrypted article password"
          git push
